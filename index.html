    })(window,document,'script','dataLayer','GTM-NHK2FF7V');</script>
    <!-- End Google Tag Manager -->
    
   <!-- Facebook Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/Promallshop NEW Logo 1.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title/description/keywords/og are NOT set here. This one file is served
         for every route in the SPA, so any static copy would be the same on every
         page and would compete with the per-page tags each page renders through
         react-helmet-async (Home.tsx, Shop.tsx, Productpage.tsx). -->
    <!-- Structured data stays here: Organization/WebSite describe the site itself,
         and <head> is where crawlers expect them. Rendering these through Helmet
         placed them in <body> instead. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Promallshop",
        "url": "https://promallshop.com",
        "logo": "https://promallshop.com/logo.png",
        "description": "Promallshop is Nigeria and Ghana's leading tech store for IT equipment, video conferencing systems, computer accessories, coding kits, IP phones, screens, and more. Trusted brands: Logitech, Yealink, MAXHUB, Huawei, Samsung, LG, Sharp.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "5B Adedeji Close, Opebi Ikeja",
          "addressLocality": "Lagos",
          "addressCountry": "NG"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-703-264-7755",
          "contactType": "customer service",
          "email": "sales@promallshop.com"
        },
        "sameAs": [
          "https://www.facebook.com/promallshop",
          "https://www.instagram.com/promallshop"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Promallshop",
        "url": "https://promallshop.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://promallshop.com/shop?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NHK2FF7V"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <!-- Facebook Pixel Code (noscript) -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=514973954298654&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Facebook Pixel Code (noscript) -->
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
